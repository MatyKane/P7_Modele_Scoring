name: Deploy to AWS

on:
  push:
    branches:
      - master

env:
  AWS_REGION: eu-west-3
  ECR_REGISTRY: 348376723843.dkr.ecr.eu-west-3.amazonaws.com
  FASTAPI_IMAGE: fastapi-backend
  STREAMLIT_IMAGE: streamlit-ui
  EB_APP_NAME: Solvability
  EB_ENV_NAME: Solvability-env-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build and push FastAPI image
        run: |
          docker build -t $ECR_REGISTRY/$FASTAPI_IMAGE:latest ./api
          docker push $ECR_REGISTRY/$FASTAPI_IMAGE:latest

      - name: Build and push Streamlit image
        run: |
          docker build -t $ECR_REGISTRY/$STREAMLIT_IMAGE:latest ./streamlit
          docker push $ECR_REGISTRY/$STREAMLIT_IMAGE:latest

      - name: Generate Dockerrun.aws.json
        run: |
          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": 2,
            "containerDefinitions": [
              {
                "name": "fastapi-backend",
                "image": "$ECR_REGISTRY/$FASTAPI_IMAGE:latest",
                "essential": true,
                "memory": 512,
                "portMappings": [
                  {
                    "hostPort": 8000,
                    "containerPort": 8000
                  }
                ]
              },
              {
                "name": "streamlit-ui",
                "image": "$ECR_REGISTRY/$STREAMLIT_IMAGE:latest",
                "essential": true,
                "memory": 512,
                "portMappings": [
                  {
                    "hostPort": 80,
                    "containerPort": 8501
                  }
                ],
                "environment": [
                  {
                    "name": "API_URL",
                    "value": "http://fastapi-backend:8000"
                  }
                ],
                "links": ["fastapi-backend"]
              }
            ]
          }
          EOF

      - name: Zip app for Elastic Beanstalk
        run: zip app.zip Dockerrun.aws.json

      - name: Upload app zip to S3
        run: aws s3 cp app.zip s3://elasticbeanstalk-eu-west-3-348376723843/app-v${{ github.run_number }}.zip

      - name: Create application version in Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name $EB_APP_NAME \
            --version-label v-${{ github.run_number }} \
            --source-bundle S3Bucket=elasticbeanstalk-eu-west-3-348376723843,S3Key=app-v${{ github.run_number }}.zip || true

      - name: Deploy application version to Elastic Beanstalk
        run: aws elasticbeanstalk update-environment \
          --environment-name $EB_ENV_NAME \
          --version-label v-${{ github.run_number }}